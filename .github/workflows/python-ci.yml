name: Tanikala Python CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: tanikala-python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python static, browser, and responsive tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run test suite
        run: python scripts/run_tests.py

      - name: Upload reports and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tanikala-python-test-reports
          path: |
            reports/
            test-results/
          if-no-files-found: warn
          retention-days: 14

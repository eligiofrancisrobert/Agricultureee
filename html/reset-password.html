<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Tanikala</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500&family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/auth/signup.css">
    <link rel="stylesheet" href="../css/feature/style.css">
    <link rel="stylesheet" href="../css/auth/forgot-password.css">

</head>

<body>
    <header class="topbar">
        <a href="../index.html" class="brand">
            <div class="logo">
                <h1>T<span>ani</span>kala</h1>
                <img src="../assets/logo.png" alt="Tanikala Logo" class="logo-image">
            </div>
        </a>

        <div class="topbar-actions">
            <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch to dark mode"
                aria-pressed="false">
                <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
                </svg>
                <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4" />
                    <path
                        d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                </svg>
            </button>
        </div>

        <p class="topbar-text">
            Remember your password?
            <a href="./login.html">Log in <span>↗</span></a>
        </p>
    </header>

    <main class="page-layout page-layout--login">
        <aside class="image-panel">
            <img src="../assets/login.jpg" alt="Farm harvest" class="image-panel__img">
            <div class="image-panel__overlay">
                <h2>Start fresh.</h2>
                <p>Choose a new password to get back to Tanikala.</p>
            </div>
        </aside>

        <form id="resetPasswordForm" novalidate>
            <div class="form-title">
                <h2>Reset password</h2>
                <p>Create a strong new password for your account.</p>
            </div>


            <div class="input-group">
                <label for="newPassword">New password *</label>
                <div class="input-wrap input-wrap--password">
                    <input type="password" id="newPassword" autocomplete="new-password" required minlength="12"
                        placeholder="Enter your new password">
                    <button type="button" class="password-toggle" data-target="newPassword"
                        aria-label="Show password">Show</button>
                </div>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm password *</label>
                <div class="input-wrap input-wrap--password">
                    <input type="password" id="confirmPassword" autocomplete="new-password" required minlength="12"
                        placeholder="Confirm your new password">
                    <button type="button" class="password-toggle" data-target="confirmPassword"
                        aria-label="Show password">Show</button>
                </div>
            </div>


            <p style="font-size: 0.85rem; line-height: 1.6;">
                Use at least 12 characters, including uppercase and
                lowercase letters, a number, and a symbol.
            </p>

            <div id="message" class="message" role="status" aria-live="polite" hidden></div>

            <button type="submit" class="submit-button" id="saveButton">
                <span>Save new password</span>
                <span class="button-arrow">→</span>
            </button>

            <p style="margin-top: 18px; text-align: center;">
                <a href="./login.html" class="text-link">Back to login</a>
            </p>
        </form>
    </main>

    <script src="../js/feature/theme.js"></script>
    <script type="module" src="../js/feature/reset-password.js"></script>
</body>

</html>

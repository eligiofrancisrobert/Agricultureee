
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Tanikala</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500&family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/auth/signup.css">
    <link rel="stylesheet" href="../css/feature/style.css">
    <link rel="stylesheet" href="../css/auth/forgot-password.css">
</head>

<body>
    <header class="topbar">
        <a href="../index.html" class="brand">
            <div class="logo">
                <h1>T<span>ani</span>kala</h1>
                <img src="../assets/logo.png" alt="Tanikala Logo" class="logo-image">
            </div>
        </a>

        <div class="topbar-actions">
            <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch to dark mode"
                aria-pressed="false">
                <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
                </svg>
                <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4" />
                    <path
                        d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                </svg>
            </button>
        </div>

        <p class="topbar-text">
            Remember your password?
            <a href="./login.html">Log in <span>↗</span></a>
        </p>
    </header>

    <main class="page-layout page-layout--login">
        <aside class="image-panel">
            <img src="../assets/forgot.jpg" alt="Harvest being sorted at a farm stand" class="image-panel__img">
            <div class="image-panel__overlay">
                <h2>Every harvest<br>starts fresh.</h2>
                <p>Recover your account and get back to growing together.</p>
            </div>
        </aside>

        <form id="forgotPasswordForm" novalidate>
            <div class="form-title">
                <h2>Forgot password?</h2>
                <p>Enter the email address associated with your Tanikala account.</p>
            </div>

            <div class="input-group">
                <label for="email">Email address *</label>
                <div class="input-wrap">
                    <input type="email" id="email" required placeholder="you@example.com" autocomplete="email">
                </div>
            </div>

            <div id="message" class="message" role="status" aria-live="polite" hidden></div>

            <button type="submit" class="submit-button" id="resetButton">
                <span>Send reset link</span>
                <span class="button-arrow">→</span>
            </button>

            <p style="margin-top: 18px; text-align: center;">
                <a href="./login.html" class="text-link">Back to login</a>
            </p>
        </form>
    </main>

    <script src="../js/feature/layout.js"></script>
    <script src="../js/feature/theme.js"></script>
    <script type="module" src="../js/feature/forgot-password.js"></script>
</body>

</html>

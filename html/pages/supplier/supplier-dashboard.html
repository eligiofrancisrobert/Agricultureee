<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Supplier | Tanikala</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&amp;family=Poppins:wght@300;400;500;600&amp;display=swap"
        rel="stylesheet">
    <!-- Shared and page-specific stylesheets. -->
    <link rel="stylesheet" href="../../../css/feature/style.css">
    <link rel="stylesheet" href="../../../css/admin/admin-dash.css">
    <link rel="stylesheet" href="../../../css/supplier/supplier.css">
    <link rel="stylesheet" href="../../../css/supplier/dashboard.css">
    <link rel="stylesheet" href="../../../css/supplier/products.css">
    <link rel="stylesheet" href="../../../css/supplier/orders.css">
    <link rel="stylesheet" href="../../../css/supplier/deliveries.css">
    <link rel="stylesheet" href="../../../css/supplier/invoice.css">
    <link rel="stylesheet" href="../../../css/supplier/settings.css">

    <!-- Restore the saved theme before page content renders. -->
    <script>
        document.documentElement.dataset.theme = localStorage.getItem('theme') || 'light';
    </script>
</head>

<body>
    <div class="shell">
        <!-- Role navigation and account actions -->
        <aside class="sidebar">
            <div class="logo">
                <h1>T<span>ani</span>kala</h1>
                <img src="../../../assets/logo.png" alt="Tanikala Logo" class="logo-image">
            </div>

            <!-- Supplier sections -->
            <nav class="nav" aria-label="Supplier sections">
                <a href="#dashboard" data-view="dashboard">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="3" y="3" width="7" height="9" rx="1.5" />
                        <rect x="14" y="3" width="7" height="5" rx="1.5" />
                        <rect x="14" y="12" width="7" height="9" rx="1.5" />
                        <rect x="3" y="16" width="7" height="5" rx="1.5" />
                    </svg>Dashboard
                </a>
                <a href="#products" data-view="products">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M21 8 12 3 3 8v8l9 5 9-5V8Z" />
                        <path d="m3 8 9 5 9-5" />
                        <path d="M12 13v8" />
                    </svg>My Products
                </a>
                <a href="#orders" data-view="orders">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M9 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-4" />
                        <path d="M9 3h6v4H9z" />
                        <path d="M8 12h8M8 16h5" />
                    </svg>Purchase Orders
                </a>
                <a href="#invoices" data-view="invoices">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6 2h9l5 5v15H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" />
                        <path d="M14 2v6h6" />
                        <path d="M8 13h8M8 17h5" />
                        <path d="M8 9h2" />
                    </svg>
                    Invoices
                </a>
                <a href="#deliveries" data-view="deliveries">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M2 6h11v10H2z" />
                        <path d="M13 9h4l4 4v3h-8" />
                        <circle cx="6.5" cy="18" r="2" />
                        <circle cx="17.5" cy="18" r="2" />
                    </svg>Deliveries
                </a>
                <a href="#settings" data-view="settings">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 7h9M17 7h3M4 17h3M11 17h9" />
                        <circle cx="15" cy="7" r="2" />
                        <circle cx="9" cy="17" r="2" />
                    </svg>Settings
                </a>
            </nav>

            <button type="button" id="logoutButton" class="nav-logout">Log out</button>
        </aside>

        <!-- Main page content -->
        <main class="main">
            <!-- Page header and account controls -->
            <header class="topbar">
                <div class="topbar-right">
                    <div class="chip">
                        <span id="todayLabel"></span>
                        <button type="button" id="themeToggle" class="icon-btn" aria-label="Switch theme">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
                            </svg>
                        </button>
                    </div>
                    <span class="avatar" id="supplierAvatar" aria-hidden="true">S</span>
                </div>
            </header>

            <!-- Dashboard view rendered by page scripts. -->
            <div id="view" role="region" aria-live="polite"></div>
        </main>
    </div>

    <!-- Transient notifications inserted by page scripts. -->
    <div id="toast" class="toast" role="status" hidden></div>
    <!-- Page-specific behavior scripts. -->
    <script type="module" src="../../../js/suppliers/main.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Settings | Accountant | Tanikala</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Shared and page-specific stylesheets -->
  <link rel="stylesheet" href="../../../css/feature/style.css">
  <link rel="stylesheet" href="../../../css/accountant/accountant.css">
  <link rel="stylesheet" href="../../../css/accountant/settings.css">

  <!-- Restore saved theme -->
  <script>
    document.documentElement.dataset.theme =
      localStorage.getItem('theme') || 'light';
  </script>
</head>

<body>
  <div class="app-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="logo">
        <h1>T<span>ani</span>kala</h1>
        <img src="../../../assets/logo.png" alt="Tanikala Logo" class="logo-image">
      </div>

      <!-- Accountant navigation -->
      <nav class="navigation" aria-label="Accountant navigation">
        <a href="accountant-dashboard.html" class="nav-link">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="7" height="9" />
            <rect x="14" y="3" width="7" height="5" />
            <rect x="14" y="12" width="7" height="9" />
            <rect x="3" y="16" width="7" height="5" />
          </svg>
          Dashboard
        </a>

        <a href="accountant-produce.html" class="nav-link">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 22V12" />
            <path d="M12 12C5 12 3 8 3 4c6 0 9 3 9 8" />
            <path d="M12 15c0-5 3-8 9-8 0 5-3 8-9 8" />
          </svg>
          Produce Records
        </a>

        <a href="accountant-sales.html" class="nav-link">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 3v18h18" />
            <path d="M7 15l4-4 3 3 5-6" />
          </svg>
          Sales Records
        </a>

        <a href="accountant-payment-history.html" class="nav-link">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
            <path d="M3 3v5h5" />
            <path d="M12 7v5l3 2" />
          </svg>
          Payment History
        </a>

        <a href="accountant-reports.html" class="nav-link">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 3v18h18" />
            <path d="M7 15l4-4 3 3 5-6" />
          </svg>
          Reports
        </a>

        <a href="accountant-settings.html" class="nav-link active" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c0-4 4-6 8-6s8 2 8 6" />
          </svg>
          Settings
        </a>
      </nav>

      <div class="sidebar-bottom">
        <button type="button" class="logout-button" id="logoutBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <path d="M16 17l5-5-5-5" />
            <path d="M21 12H9" />
          </svg>
          Log out
        </button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main-content">
      <header class="topbar">
        <div>
          <h2>Settings</h2>
        </div>
        <div class="topbar-right">
          <div class="chip">
            <span id="todayLabel"></span>
            <button type="button" class="icon-btn" id="themeToggle" aria-label="Toggle light/dark theme">
              <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
              </svg>
              <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4" />
                <path
                  d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
              </svg>
            </button>
          </div>
          <div class="profile">
            <div class="avatar" id="userInitial">A</div>
            <div>
              <p id="userName">Accountant</p>
              <span>Accountant</span>
            </div>
          </div>
        </div>
      </header>

      <!-- accountant-settings.js renders the settings panels into this container. -->
      <div id="settingsRoot">
        <div class="loading-state" role="status">Loading settings...</div>
      </div>
    </main>
  </div>

  <!-- Transient notifications inserted by page scripts. -->
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <!-- Page-specific behavior scripts. -->
  <script type="module" src="../../../js/accountant/settings.js"></script>
  <script type="module" src="../../../js/feature/theme.js"></script>
</body>

</html>

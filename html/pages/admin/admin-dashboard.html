<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        html:not(.admin-authorized) body {
            display: none !important;
        }
    </style>
    <title>Tanikala Admin (new)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../../css/feature/style.css">
    <link rel="stylesheet" href="../../../css/admin/admin-dash.css">
    <link rel="stylesheet" href="../../../css/admin/staff.css">
    <script>
        // Apply saved theme before paint
        document.documentElement.dataset.theme = localStorage.getItem('theme') || 'light';
    </script>
</head>

<body>
    <div class="shell">
        <aside class="sidebar">
            <div class="logo">
                <h1>T<span>ani</span>kala</h1>
                <img src="../../../assets/logo.png" alt="Tanikala Logo" class="logo-image">
            </div>
            <nav class="nav" aria-label="Admin sections">
                <a href="#dashboard" data-view="dashboard"><svg viewBox="0 0 24 24">
                        <rect x="3" y="3" width="7" height="9" rx="1.5" />
                        <rect x="14" y="3" width="7" height="5" rx="1.5" />
                        <rect x="14" y="12" width="7" height="9" rx="1.5" />
                        <rect x="3" y="16" width="7" height="5" rx="1.5" />
                    </svg>Dashboard</a>
                <a href="#applications" data-view="applications"><svg viewBox="0 0 24 24">
                        <rect x="5" y="4" width="14" height="17" rx="2" />
                        <path d="M9 4h6v3H9zM9 12l2 2 4-4" />
                    </svg>Applications</a>
                <a href="#staff" data-view="staff"><svg viewBox="0 0 24 24">
                        <circle cx="9" cy="8" r="3.5" />
                        <path
                            d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14.3c2 .7 3.5 2.6 3.5 5.7" />
                    </svg>
                    <span>Staff</span>
                </a>
                <div class="nav-group">
                    <button type="button" class="nav-parent" id="usersParent" aria-expanded="false"
                        aria-controls="usersMenu"><svg viewBox="0 0 24 24">
                            <circle cx="9" cy="8" r="3.5" />
                            <path
                                d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14.3c2 .7 3.5 2.6 3.5 5.7" />
                        </svg>Users<svg class="chev" viewBox="0 0 24 24">
                            <path d="m6 9 6 6 6-6" />
                        </svg></button>
                    <div class="submenu" id="usersMenu" hidden>
                        <a href="#users" data-sub="">All users</a>
                        <a href="#users/pending" data-sub="pending">Pending <span id="pendingCount"
                                class="count"></span></a>
                        <a href="#users/active" data-sub="active">Active</a>
                        <a href="#users/suspended" data-sub="suspended">Suspended</a>
                        <a href="#users/rejected" data-sub="rejected">Rejected</a>
                    </div>
                </div>
                <a href="#audit" data-view="audit"><svg viewBox="0 0 24 24">
                        <path d="M4 6h16M4 12h16M4 18h10" />
                        <circle cx="18" cy="18" r="2" />
                    </svg>Audit logs</a>
                <a href="#settings" data-view="settings"><svg viewBox="0 0 24 24">
                        <path d="M4 7h9M17 7h3M4 17h3M11 17h9" />
                        <circle cx="15" cy="7" r="2" />
                        <circle cx="9" cy="17" r="2" />
                    </svg>Settings</a>
            </nav>

            <button type="button" id="logoutButton" class="nav-logout">Log out</button>
        </aside>

        <main class="main">
            <header class="topbar">
                <label class="search">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="7" />
                        <path d="m20 20-3.5-3.5" />
                    </svg>
                    <input id="adminSearch" type="search" placeholder="Search name or email" autocomplete="off">
                </label>

                <div class="topbar-right">
                    <div class="chip">
                        <span id="todayLabel"></span>
                        <button type="button" id="themeToggle" class="icon-btn" aria-label="Switch theme">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
                            </svg>
                        </button>
                    </div>
                    <a class="bell" href="#applications" aria-label="Pending applications">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 17V11a6 6 0 1 1 12 0v6l1.5 2h-15zM10 21h4" />
                        </svg>
                        <span id="bellCount" hidden>0</span>
                    </a>
                    <span class="avatar" aria-hidden="true">AD</span>
                </div>
            </header>

            <div id="view" role="region" aria-live="polite"></div>
        </main>
    </div>

    <div id="toast" class="toast" role="status" hidden></div>
    <script type="module" src="../../../js/admin/main.js"></script>
</body>

</html>

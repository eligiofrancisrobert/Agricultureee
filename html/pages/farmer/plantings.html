
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Plantings | Tanikala</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../../../css/feature/style.css">
    <link rel="stylesheet" href="../../../css/farmer/farmer.css">
    <link rel="stylesheet" href="../../../css/farmer/farmer-activities.css">

    <script>
        document.documentElement.dataset.theme =
            localStorage.getItem('theme') || 'light';
    </script>

    <script type="module" src="../../../js/farmer/plantings.js"></script>
</head>

<body>

    <div class="app-layout">

        <aside class="sidebar">
            <div class="logo">
                <h1>T<span>ani</span>kala</h1>
                <img src="../../../assets/logo.png" alt="Tanikala Logo" class="logo-image">
            </div>

            <nav class="navigation" aria-label="Farmer sections">

                <a href="farmer-dashboard.html" class="nav-link">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="3" y="3" width="7" height="9" rx="1.5" />
                        <rect x="14" y="3" width="7" height="5" rx="1.5" />
                        <rect x="14" y="12" width="7" height="9" rx="1.5" />
                        <rect x="3" y="16" width="7" height="5" rx="1.5" />
                    </svg>
                    Dashboard
                </a>

                <a href="#" class="nav-link" data-coming-soon>
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 21V10l8-6 8 6v11" />
                        <path d="M9 21v-7h6v7" />
                        <path d="M9 14l6 7M15 14l-6 7" />
                        <path d="M2 21h20" />
                    </svg>
                    Assigned Farms
                </a>

                <a href="activities.html" class="nav-link">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M9 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-4" />
                        <path d="M9 3h6v4H9z" />
                        <path d="m8 13 2 2 5-5" />
                    </svg>
                    My Activities
                </a>

                <a href="plantings.html" class="nav-link active" aria-current="page">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 21v-8" />
                        <path d="M12 13C7 13 4 10 4 5c5 0 8 3 8 8Z" />
                        <path d="M12 16c0-4 3-7 8-7 0 5-3 8-8 8" />
                    </svg>
                    My Plantings
                </a>

            </nav>

            <div class="sidebar-bottom">

                <a href="#" class="nav-link" data-coming-soon>
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 7h9M17 7h3M4 17h3M11 17h9" />
                        <circle cx="15" cy="7" r="2" />
                        <circle cx="9" cy="17" r="2" />
                    </svg>
                    Settings
                </a>

                <button type="button" id="logoutButton" class="logout-button">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                        <path d="m16 17 5-5-5-5" />
                        <path d="M21 12H9" />
                    </svg>
                    <span id="logoutLabel">Log out</span>
                </button>

            </div>
        </aside>

        <main class="main-content">

            <header class="topbar">
                <div>
                    <h2>My Plantings</h2>
                </div>

                <div class="topbar-right">

                    <div class="chip">
                        <span id="todayLabel"></span>

                        <button type="button" id="themeToggle"
                            class="icon-btn" aria-label="Switch theme">

                            <svg class="icon-moon" viewBox="0 0 24 24"
                                width="18" height="18" fill="none"
                                stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round"
                                aria-hidden="true">
                                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
                            </svg>

                            <svg class="icon-sun" viewBox="0 0 24 24"
                                width="18" height="18" fill="none"
                                stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round"
                                aria-hidden="true">
                                <circle cx="12" cy="12" r="4" />
                                <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                            </svg>

                        </button>
                    </div>

                    <div class="profile">
                        <div class="avatar" id="farmerAvatar">F</div>
                        <div>
                            <p id="farmerName">Loading...</p>
                            <span>Farmer</span>
                        </div>
                    </div>

                </div>
            </header>

            <section class="activities-toolbar">
                <div class="section-heading">
                    <h2>Your Planting Records</h2>
                    <p>
                        View planting records associated with activities
                        assigned to you by your Farm Manager.
                    </p>
                </div>
            </section>

            <section id="plantingList" class="activity-list" aria-live="polite">
                <div class="loading-state">
                    Loading your planting records...
                </div>
            </section>

        </main>
    </div>

</body>
</html>

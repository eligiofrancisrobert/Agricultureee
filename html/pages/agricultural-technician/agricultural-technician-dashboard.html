<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <style>
        html:not(.at-authorized) body {
            display: none !important;
        }
    </style>

    <title>Agricultural Technician | Tanikala</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../../../css/feature/style.css">
    <link rel="stylesheet" href="../../../css/admin/admin-dash.css">
    <link rel="stylesheet" href="../../../css/agricultural-technician/shell.css">
    <link rel="stylesheet" href="../../../css/agricultural-technician/dashboard.css">
    <link rel="stylesheet" href="../../../css/agricultural-technician/assigned-farms.css">
    <link rel="stylesheet" href="../../../css/agricultural-technician/crop-monitoring.css">
    <link rel="stylesheet" href="../../../css/agricultural-technician/field-inspection.css">
    <link rel="stylesheet" href="../../../css/agricultural-technician/crop-assessments.css">
    <link rel="stylesheet" href="../../../css/agricultural-technician/recommendations.css"> 
    <link rel="stylesheet" href="../../../css/agricultural-technician/monitoring-reports.css">
    <link rel="stylesheet" href="../../../css/agricultural-technician/settings.css">

    <script>
        document.documentElement.dataset.theme =
            localStorage.getItem('theme') || 'light';
    </script>
</head>

<body>
    <div class="shell">

        <!-- CHANGED: added id="sidebar" -->
        <aside class="sidebar" id="sidebar">
            <div class="logo">
                <h1>T<span>ani</span>kala</h1>
                <img src="../../../assets/logo.png" alt="Tanikala Logo" class="logo-image">

                <!-- NEW: close button (only visible in the mobile drawer) -->
                <button type="button" id="menuClose" class="menu-close" aria-label="Close menu">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6 6l12 12M18 6L6 18" />
                    </svg>
                </button>
            </div>

            <nav class="nav" aria-label="Agricultural Technician sections">

                <a href="#dashboard" data-view="dashboard">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="3" y="3" width="7" height="9" rx="1.5" />
                        <rect x="14" y="3" width="7" height="5" rx="1.5" />
                        <rect x="14" y="12" width="7" height="9" rx="1.5" />
                        <rect x="3" y="16" width="7" height="5" rx="1.5" />
                    </svg>
                    Dashboard
                </a>

                <a href="#assigned-farms" data-view="assigned-farms">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 21V9l9-6 9 6v12" />
                        <path d="M9 21v-7h6v7" />
                        <path d="M2 21h20" />
                    </svg>
                    Assigned Farms
                </a>

                <a href="#crop-monitoring" data-view="crop-monitoring">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 22V12" />
                        <path d="M12 12C5 12 4 7 4 3c5 0 8 3 8 9Z" />
                        <path d="M12 16c0-5 3-9 8-9 0 5-3 9-8 9Z" />
                    </svg>
                    Crop Monitoring
                </a>

                <a href="#field-inspections" data-view="field-inspections">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M9 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-4" />
                        <path d="M9 3h6v4H9z" />
                        <path d="m8 14 2 2 5-5" />
                    </svg>
                    Field Inspections
                </a>

                <a href="#crop-assessments" data-view="crop-assessments">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 19V5" />
                        <path d="M4 19h16" />
                        <path d="m7 15 4-4 3 2 5-7" />
                    </svg>
                    Crop Assessments
                </a>

                <a href="#recommendations" data-view="recommendations">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 3v3" />
                        <path d="M12 18v3" />
                        <path d="M3 12h3" />
                        <path d="M18 12h3" />
                        <path d="m5.6 5.6 2.1 2.1" />
                        <path d="m16.3 16.3 2.1 2.1" />
                        <path d="m18.4 5.6-2.1 2.1" />
                        <path d="m7.7 16.3-2.1 2.1" />
                        <circle cx="12" cy="12" r="5" />
                    </svg>
                    Recommendations
                </a>

                <a href="#monitoring-reports" data-view="monitoring-reports">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M5 21V11" />
                        <path d="M12 21V4" />
                        <path d="M19 21v-7" />
                    </svg>
                    Monitoring Reports
                </a>

                <a href="#settings" data-view="settings">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 7h9M17 7h3M4 17h3M11 17h9" />
                        <circle cx="15" cy="7" r="2" />
                        <circle cx="9" cy="17" r="2" />
                    </svg>
                    Settings
                </a>

            </nav>

            <button type="button" id="logoutButton" class="nav-logout">
                Log out
            </button>
        </aside>

        <main class="main">

            <header class="topbar">

                <!-- NEW: hamburger button (only visible at 900px and below) -->
                <button type="button" id="menuToggle" class="menu-toggle" aria-label="Open menu"
                    aria-controls="sidebar" aria-expanded="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 7h16M4 12h16M4 17h16" />
                    </svg>
                </button>

                <label class="search">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="7" />
                        <path d="m20 20-3.5-3.5" />
                    </svg>

                    <input id="atSearch" type="search" placeholder="Search farms, crops, or records..."
                        aria-label="Search farms, crops, or records" autocomplete="off">
                </label>

                <div class="topbar-right">
                    <div class="chip">
                        <span id="todayLabel"></span>

                        <button type="button" id="themeToggle" class="icon-btn" aria-label="Switch theme">

                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
                            </svg>
                        </button>
                    </div>

                    <span class="avatar" id="atAvatar" aria-hidden="true">
                        AT
                    </span>
                </div>
            </header>

            <div id="view" role="region" aria-live="polite"></div>

        </main>

        <!-- NEW: dimmed backdrop behind the open drawer -->
        <div id="sidebarBackdrop" class="sidebar-backdrop"></div>
    </div>

    <div id="toast" class="toast" role="status" hidden></div>

    <script type="module" src="../../../js/agricultural-technician/main.js"></script>
</body>

</html>

[pytest]
testpaths = tests
addopts =
    -ra
    --strict-markers
    --html=reports/report.html
    --self-contained-html
    --junitxml=reports/junit.xml
    --cov=tests
    --cov=scripts
    --cov-report=term-missing
    --cov-report=xml:reports/coverage.xml
markers =
    functional: browser-based interactive behavior tests
    responsive: layout checks at supported viewport sizes
    runtime: HTTP and direct-route runtime checks
    slow: longer-running test scenarios

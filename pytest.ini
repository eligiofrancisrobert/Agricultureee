[pytest]
# Discover the Python test suite and emit machine-readable and browser-friendly reports.
testpaths = tests
# Keep the default invocation strict and collect coverage for the test harness itself.
addopts =
    -ra
    --strict-markers
    --html=reports/report.html
    --self-contained-html
    --junitxml=reports/junit.xml
    --cov=tests
    --cov=scripts
    --cov-report=term-missing
    --cov-report=xml:reports/coverage.xml
# Labels let runtime entry points and developers select related test groups.
markers =
    functional: browser-based interactive behavior tests
    responsive: layout checks at supported viewport sizes
    runtime: HTTP and direct-route runtime checks
    slow: longer-running test scenarios
